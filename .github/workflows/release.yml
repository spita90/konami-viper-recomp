# Release packages: the launcher, the runtime's sources and a C compiler, never anything built
# from the games (dist/launcher.py builds them on the player's computer).
#   push a tag v*          -> builds and attaches the packages to that tag's GitHub release
#   push changes to the packaging, or run it by hand -> builds them as workflow artifacts only
name: release

on:
  push:
    tags: ['v*']
    branches: ['**']
    # (not evaluated for tags: every v* tag builds)
    paths: ['dist/**', '.github/workflows/release.yml', 'third_party/libchdr/**', 'tools/chdextract.c']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux-x86_64:
    # the oldest supported runner: the launcher runs on systems with this glibc (2.35) or newer
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build dependencies (PyInstaller, SDL2's backends)
        run: |
          pip install pyinstaller==6.16.0
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libasound2-dev libpulse-dev libpipewire-0.3-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev libxss-dev \
            libxkbcommon-dev libdrm-dev libgbm-dev libgl1-mesa-dev libgles2-mesa-dev libegl1-mesa-dev \
            libdbus-1-dev libibus-1.0-dev libudev-dev libwayland-dev wayland-protocols libdecor-0-dev

      - name: Package
        # the tag's version (v0.12.0 -> 0.12.0), or git describe when run by hand
        run: dist/build-release.sh ${{ startsWith(github.ref, 'refs/tags/v') && format('"{0}"', github.ref_name) || '' }}

      - uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64
          path: build/release/*.tar.xz

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes "See CHANGELOG.md."
          gh release upload "$GITHUB_REF_NAME" build/release/*.tar.xz --clobber
